// Apply the Android Application plugin to enable Android-specific build features
apply plugin: 'com.android.application'

android {
    // Defines the namespace for the R and BuildConfig classes generated by aapt2
    namespace = "com.DriveLogicAI"
    // Sets the API level that Gradle uses to compile your app
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        // Uniquely identifies the app on the device and in the Google Play Store
        applicationId "com.DriveLogicAI_chat"
        // Minimum API level required to run the app
        minSdkVersion rootProject.ext.minSdkVersion
        // Target API level for which the app is designed and tested
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Internal version number used for app updates
        versionCode 34
        // Public version string shown to users
        versionName "2.33"
        
        // Specifies the runner used for instrumented tests
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword "MakersMarka7a8\$\$\$"
            keyAlias "drivelogicai_key"
            keyPassword "MakersMarka7a8\$\$\$"
        }
    }
    
    buildTypes {
        release {
            // Disables code shrinking, obfuscation, and optimization for the release build type
            minifyEnabled false
            // Defines the ProGuard rule files to be applied if minifyEnabled is set to true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Apply the release signing configuration
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        // Defines flat directories to look for local dependencies (like AAR files)
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Includes all JAR files in the 'libs' directory as dependencies
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // AndroidX dependencies for UI and core functionality
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    // Google Mobile Ads SDK (AdMob)
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    
    // Capacitor core dependency
    implementation project(':capacitor-android')
    
    // Testing dependencies
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    
    // Capacitor Cordova plugins dependency
    implementation project(':capacitor-cordova-android-plugins')
}

// Apply Capacitor-specific build configurations
apply from: 'capacitor.build.gradle'

try {
    // Conditionally apply the Google Services plugin if google-services.json exists
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    // Log a message if the google-services.json file is not found
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
